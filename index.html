<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAM⚡VERSE — Cinematic Reviews & Analysis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            cyan: '#06B6D4',
                            neon: '#22D3EE',
                            violet: '#A855F7',
                            pink: '#EC4899',
                            dark: '#030712'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" onclick="switchView('landing')" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-brand-neon flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-bolt text-slate-950 text-xl font-black"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-syne font-extrabold text-2xl tracking-wider text-white">STREAM<span class="text-brand-cyan">⚡</span>VERSE</span>
                    <span class="text-[10px] tracking-widest text-slate-400 uppercase font-semibold">Cinematic Intelligence</span>
                </div>
            </a>
            
            <div class="flex items-center gap-4">
                <button onclick="switchView('landing')" class="text-slate-300 hover:text-brand-cyan text-sm font-bold px-3 py-2">
                    <i class="fa-solid fa-film mr-1"></i> Reviews
                </button>
                <button onclick="switchView('admin')" class="bg-brand-cyan/10 border border-brand-cyan/40 hover:bg-brand-cyan hover:text-slate-950 text-brand-neon px-4 py-2 rounded-full text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Admin Studio
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full py-8">
        
        <!-- ================= LANDING VIEW ================= -->
        <div id="landingView" class="space-y-12">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div>
                    <h2 class="font-syne font-bold text-3xl text-white tracking-tight">Published Reviews</h2>
                    <p class="text-slate-400 text-sm mt-1">Latest film critiques and cinematic analysis</p>
                </div>
            </div>

            <!-- Dynamic Review Cards Grid -->
            <div id="moviesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Cards will render here automatically -->
            </div>
        </div>

        <!-- ================= REVIEW DETAIL VIEW ================= -->
        <div id="reviewView" class="hidden max-w-4xl mx-auto space-y-8">
            <button onclick="switchView('landing')" class="inline-flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-brand-cyan bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl">
                <i class="fa-solid fa-arrow-left"></i> Back to Reviews
            </button>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 bg-slate-900/60 border border-slate-800 rounded-3xl p-8 backdrop-blur-sm">
                <div class="md:col-span-1">
                    <img id="reviewPoster" src="" alt="Movie Poster" class="w-full aspect-[2/3] object-cover rounded-2xl border border-slate-800 shadow-lg">
                </div>
                <div class="md:col-span-2 space-y-4">
                    <div class="flex items-center gap-3 text-xs font-bold text-brand-cyan">
                        <span id="reviewGenre"></span> • <span id="reviewYear"></span>
                    </div>
                    <h1 id="reviewTitle" class="font-syne font-extrabold text-4xl text-white"></h1>
                    <div class="text-amber-400 font-extrabold text-lg" id="reviewRatingScore"></div>
                    <p id="reviewSubtitle" class="text-slate-300 font-medium text-sm"></p>
                    <p id="reviewSummaryText" class="text-slate-400 text-sm pt-2 border-t border-slate-800"></p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 text-slate-300 leading-relaxed">
                <h3 class="font-syne font-bold text-2xl text-white border-b border-slate-800 pb-4">Full Critique</h3>
                <div id="reviewBodyContent" class="space-y-4"></div>
            </div>
        </div>

        <!-- ================= ADMIN DASHBOARD (Your Easy Publisher) ================= -->
        <div id="adminView" class="hidden max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6">
            <div class="border-b border-slate-800 pb-4">
                <h2 class="font-syne font-bold text-2xl text-white flex items-center gap-3">
                    <i class="fa-solid fa-pen-nib text-brand-cyan"></i> Publish New Film Review
                </h2>
                <p class="text-slate-400 text-xs mt-1">Fill out the fields below to publish a review straight onto your platform.</p>
            </div>

            <form id="reviewForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Movie Title</label>
                    <input type="text" id="formTitle" placeholder="e.g. Wicker" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-cyan">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Genre</label>
                        <input type="text" id="formGenre" placeholder="e.g. Comedy / Drama" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-cyan">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Release Year</label>
                        <input type="text" id="formYear" placeholder="2026" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-cyan">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Rating</label>
                        <input type="text" id="formRating" placeholder="⭐ 4.5/5" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-cyan">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Headline / Subtitle</label>
                    <input type="text" id="formSubtitle" placeholder="e.g. Olivia Colman shines in an eccentric masterpiece" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-cyan">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Movie Poster Image (Select file from your Mac)</label>
                    <input type="file" id="formPosterFile" accept="image/*" onchange="convertImageToBase64()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-brand-cyan file:text-slate-950 cursor-pointer">
                    <input type="hidden" id="formPosterData">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Short Summary</label>
                    <textarea id="formSummary" rows="2" placeholder="Brief summary of the film..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-brand-cyan"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Full Written Critique</label>
                    <textarea id="formBody" rows="6" placeholder="Write your full review here..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-brand-cyan"></textarea>
                </div>

                <button type="submit" class="w-full bg-brand-cyan hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-xl transition-all shadow-lg shadow-cyan-500/20 text-base">
                    🚀 Publish Review Instantly
                </button>
            </form>
        </div>

    </main>

    <!-- Script Logic -->
    <script>
        // Initial reviews database
        const defaultReviews = {
            "wicker": {
                title: "Wicker",
                genre: "Dark Comedy / Romance",
                year: "2026",
                rating: "⭐ 4.5/5",
                subtitle: "An eccentric, beautifully acted tale of loneliness and custom craft",
                summary: "Olivia Colman shines in this delightfully strange and moving comedy about a fisherwoman who commissions a husband made entirely of wicker.",
                poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&q=80&w=800",
                body: "In Wicker, Olivia Colman delivers another masterful, deeply human performance. Playing a quiet fisherwoman on the margins of a conservative village, her life takes a surreal turn when she decides to commission a local basket maker to weave her a husband out of wicker."
            }
        };

        function getStoredReviews() {
            const saved = localStorage.getItem('streamverse_reviews');
            return saved ? JSON.parse(saved) : defaultReviews;
        }

        function renderGrid() {
            const reviews = getStoredReviews();
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            Object.keys(reviews).forEach(key => {
                const item = reviews[key];
                const card = `
                    <div onclick="openReview('${key}')" class="group bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden hover:border-brand-cyan/50 transition-all duration-300 cursor-pointer flex flex-col shadow-xl">
                        <div class="relative aspect-video overflow-hidden bg-slate-950">
                            <img src="${item.poster}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-3 right-3 bg-slate-950/80 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-extrabold text-amber-400">${item.rating}</div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow justify-between space-y-4">
                            <div>
                                <div class="text-xs font-semibold text-brand-cyan mb-2">${item.genre} • ${item.year}</div>
                                <h3 class="font-syne font-bold text-xl text-white group-hover:text-brand-neon transition-colors">${item.title}</h3>
                                <p class="text-slate-400 text-xs mt-2 line-clamp-2">${item.summary}</p>
                            </div>
                            <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs font-bold text-brand-cyan">
                                <span>Read Review</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function switchView(viewName) {
            document.getElementById('landingView').classList.add('hidden');
            document.getElementById('reviewView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');

            if (viewName === 'landing') {
                renderGrid();
                document.getElementById('landingView').classList.remove('hidden');
            } else if (viewName === 'admin') {
                document.getElementById('adminView').classList.remove('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openReview(key) {
            const reviews = getStoredReviews();
            const data = reviews[key];
            if (!data) return;

            document.getElementById('reviewTitle').innerText = data.title;
            document.getElementById('reviewGenre').innerText = data.genre;
            document.getElementById('reviewYear').innerText = data.year;
            document.getElementById('reviewRatingScore').innerText = data.rating;
            document.getElementById('reviewSubtitle').innerText = data.subtitle;
            document.getElementById('reviewSummaryText').innerText = data.summary;
            document.getElementById('reviewPoster').src = data.poster;
            document.getElementById('reviewBodyContent').innerHTML = `<p>${data.body}</p>`;

            document.getElementById('landingView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('reviewView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function convertImageToBase64() {
            const file = document.getElementById('formPosterFile').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('formPosterData').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('formTitle').value;
            const key = title.toLowerCase().replace(/[^a-z0-9]/g, '-');
            const posterData = document.getElementById('formPosterData').value || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&q=80&w=800';

            const newReview = {
                title: title,
                genre: document.getElementById('formGenre').value,
                year: document.getElementById('formYear').value,
                rating: document.getElementById('formRating').value,
                subtitle: document.getElementById('formSubtitle').value,
                summary: document.getElementById('formSummary').value,
                poster: posterData,
                body: document.getElementById('formBody').value
            };

            const currentReviews = getStoredReviews();
            currentReviews[key] = newReview;
            localStorage.setItem('streamverse_reviews', JSON.stringify(currentReviews));

            alert('🎉 Review Published Successfully!');
            document.getElementById('reviewForm').reset();
            switchView('landing');
        }

        // Initialize grid on load
        renderGrid();
    </script>
</body>
</html>
