<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAM⚡VERSE — Cinematic Reviews & Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        brand: { cyan: '#06B6D4', neon: '#22D3EE', violet: '#A855F7', pink: '#EC4899', dark: '#030712' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased flex flex-col min-h-screen">

    <!-- Clean Header Navigation -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" onclick="switchView('landing')" class="flex items-center gap-3 group cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-brand-neon flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-bolt text-slate-950 text-xl font-black"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-syne font-extrabold text-2xl tracking-wider text-white">STREAM<span class="text-brand-cyan">⚡</span>VERSE</span>
                    <span class="text-[10px] tracking-widest text-slate-400 uppercase font-semibold">Cinematic Intelligence</span>
                </div>
            </a>
            
            <div class="flex items-center gap-4">
                <button onclick="switchView('admin')" class="bg-brand-cyan/10 border border-brand-cyan/40 hover:bg-brand-cyan hover:text-slate-950 text-brand-neon px-5 py-2.5 rounded-full text-xs font-bold transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/10 cursor-pointer">
                    <i class="fa-solid fa-plus-circle"></i> Admin Studio
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full py-8">
        
        <!-- ================= LANDING PAGE ================= -->
        <div id="landingView" class="space-y-12">
            
            <!-- Clean Hero Spotlight Banner -->
            <div id="heroSection" class="relative rounded-3xl overflow-hidden border border-slate-800/80 bg-slate-900/40 shadow-2xl">
                <div class="grid grid-cols-1 lg:grid-cols-12">
                    <div class="lg:col-span-7 p-8 lg:p-12 flex flex-col justify-between space-y-6">
                        <div class="space-y-4 pt-4">
                            <h1 id="heroTitle" class="font-syne font-extrabold text-4xl sm:text-5xl lg:text-6xl text-white tracking-tight leading-none"></h1>
                            <p id="heroSubtitle" class="text-brand-neon text-base sm:text-lg font-semibold pt-2"></p>
                        </div>
                        <div class="pt-8 border-t border-slate-800/80">
                            <button id="heroBtn" onclick="" class="bg-gradient-to-r from-brand-cyan to-brand-neon text-slate-950 font-extrabold px-6 py-3.5 rounded-2xl hover:opacity-90 transition-all flex items-center gap-2 text-sm shadow-lg shadow-cyan-500/20 cursor-pointer">
                                Read Full Review <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                    <div class="lg:col-span-5 relative min-h-[320px] lg:min-h-full overflow-hidden bg-slate-950">
                        <img id="heroPoster" src="" alt="Featured Poster" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent lg:bg-gradient-to-r lg:from-slate-950 lg:via-transparent lg:to-transparent"></div>
                        <div id="heroRating" class="absolute top-4 right-4 bg-slate-950/80 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-2xl text-sm font-extrabold text-amber-400 flex items-center gap-1.5 shadow-xl"></div>
                    </div>
                </div>
            </div>

            <!-- Header + Category Filter Tabs -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-800 pb-5 gap-4">
                <div>
                    <h2 class="font-syne font-bold text-3xl text-white tracking-tight">Reviews</h2>
                    <p class="text-slate-400 text-xs mt-1">Latest critiques across film, TV, and digital media</p>
                </div>

                <!-- 4 Category Tabs + All -->
                <div class="flex items-center gap-2 overflow-x-auto pb-2 sm:pb-0">
                    <button onclick="setCategoryFilter('all')" id="tab-all" class="category-tab active-tab px-4 py-2 rounded-xl text-xs font-bold transition-all border border-brand-cyan/40 bg-brand-cyan text-slate-950 shadow-md cursor-pointer">
                        All
                    </button>
                    <button onclick="setCategoryFilter('Films')" id="tab-Films" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all border border-slate-800 bg-slate-900 text-slate-400 hover:text-white hover:border-slate-700 cursor-pointer">
                        <i class="fa-solid fa-film mr-1.5 text-brand-cyan"></i> Films
                    </button>
                    <button onclick="setCategoryFilter('Series')" id="tab-Series" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all border border-slate-800 bg-slate-900 text-slate-400 hover:text-white hover:border-slate-700 cursor-pointer">
                        <i class="fa-solid fa-tv mr-1.5 text-brand-cyan"></i> Series
                    </button>
                    <button onclick="setCategoryFilter('Documentaries')" id="tab-Documentaries" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all border border-slate-800 bg-slate-900 text-slate-400 hover:text-white hover:border-slate-700 cursor-pointer">
                        <i class="fa-solid fa-video mr-1.5 text-brand-cyan"></i> Documentaries
                    </button>
                    <button onclick="setCategoryFilter('Videos')" id="tab-Videos" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all border border-slate-800 bg-slate-900 text-slate-400 hover:
