<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAM⚡VERSE — Cinematic Reviews & Analysis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            cyan: '#06B6D4',
                            neon: '#22D3EE',
                            violet: '#A855F7',
                            pink: '#EC4899',
                            dark: '#030712'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" onclick="switchView('landing')" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-brand-neon flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-bolt text-slate-950 text-xl font-black"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-syne font-extrabold text-2xl tracking-wider text-white">STREAM<span class="text-brand-cyan">⚡</span>VERSE</span>
                    <span class="text-[10px] tracking-widest text-slate-400 uppercase font-semibold">Cinematic Intelligence</span>
                </div>
            </a>
            
            <div class="flex items-center gap-4">
                <button onclick="switchView('landing')" class="text-slate-300 hover:text-brand-cyan text-sm font-bold px-3 py-2">
                    <i class="fa-solid fa-film mr-1"></i> Reviews
                </button>
                <button onclick="switchView('admin')" class="bg-brand-cyan/10 border border-brand-cyan/40 hover:bg-brand-cyan hover:text-slate-950 text-brand-neon px-4 py-2 rounded-full text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Admin Studio
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full py-8">
        
        <!-- ================= LANDING VIEW ================= -->
        <div id="landingView" class="space-y-12">
            <!-- Hero Featured Review -->
            <div id="heroSection" class="relative rounded-3xl overflow-hidden border border-slate-800/80 bg-slate-900/40 shadow-2xl">
                <div class="grid grid-cols-1 lg:grid-cols-12">
                    <div class="lg:col-span-7 p-8 lg:p-12 flex flex-col justify-between space-y-6">
                        <div class="space-y-4">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-cyan/10 border border-brand-cyan/30 text-brand-cyan text-xs font-extrabold uppercase tracking-wider">
                                <i class="fa-solid fa-star text-amber-400"></i> Spotlight Premiere
                            </div>
                            <h1 id="heroTitle" class="font-syne font-extrabold text-3xl sm:text-4xl lg:text-5xl text-white tracking-tight leading-none"></h1>
                            <p id="heroSubtitle" class="text-brand-neon text-sm sm:text-base font-semibold"></p>
                            <p id="heroSummary" class="text-slate-300 text-sm sm:text-base leading-relaxed line-clamp-3"></p>
                        </div>
                        <div class="pt-4 border-t border-slate-800/80 flex items-center gap-4">
                            <button id="heroBtn" onclick="" class="bg-gradient-to-r from-brand-cyan to-brand-neon text-slate-950 font-extrabold px-6 py-3 rounded-2xl hover:opacity-90 transition-all flex items-center gap-2 text-sm shadow-lg shadow-cyan-500/20">
                                Read Full Review <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                    <div class="lg:col-span-5 relative min-h-[300px] lg:min-h-full overflow-hidden bg-slate-950">
                        <img id="heroPoster" src="" alt="Featured Poster" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent lg:bg-gradient-to-r lg:from-slate-950 lg:via-transparent lg:to-transparent"></div>
                        <div id="heroRating" class="absolute top-4 right-4 bg-slate-950/80 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-2xl text-sm font-extrabold text-amber-400 flex items-center gap-1.5 shadow-xl"></div>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div>
                    <h2 class="font-syne font-bold text-3xl text-white tracking-tight">All Reviews</h2>
                    <p class="text-slate-400 text-sm mt-1">Latest film critiques and cinematic analysis</p>
                </div>
            </div>

            <!-- Dynamic Review Cards Grid -->
            <div id="moviesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Cards render dynamically -->
            </div>
        </div>

        <!-- ================= REVIEW DETAIL VIEW ================= -->
        <div id="reviewView" class="hidden max-w-4xl mx-auto space-y-8">
            <button onclick="switchView('landing')" class="inline-flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-brand-cyan bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl">
                <i class="fa-solid fa-arrow-left"></i> Back to Reviews
            </button>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 bg-slate-900/60 border border-slate-800 rounded-3xl p-8 backdrop-blur-sm">
                <div class="md:col-span-1">
                    <img id="reviewPoster" src="" alt="Movie Poster" class="w-full aspect-[2/3] object-cover rounded-2xl border border-slate-800 shadow-lg">
                </div>
                <div class="md:col-span-2 space-y-4">
                    <div class="flex items-center gap-3 text-xs font-bold text-brand-cyan">
                        <span id="reviewGenre"></span> • <span id="reviewYear"></span>
                    </div>
                    <h1 id="reviewTitle" class="font-syne font-extrabold text-4xl text-white"></h1>
                    <div class="text-amber-400 font-extrabold text-lg" id="reviewRatingScore"></div>
                    <p id="reviewSubtitle" class="text-slate-300 font-medium text-sm"></p>
                    <p id="reviewSummaryText" class="text-slate-400 text-sm pt-2 border-t border-slate-800"></p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 text-slate-300 leading-relaxed">
                <h3 class="font-syne font-bold text-2xl text-white border-b border-slate-800 pb-4">Full Critique</h3>
                <div id="reviewBodyContent" class
